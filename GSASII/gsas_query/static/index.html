<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GSAS-II Assistant</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --primary:     #1a4f8a;
    --primary-dk:  #0d3060;
    --accent:      #e87722;
    --bg:          #f4f6f9;
    --surface:     #ffffff;
    --user-bg:     #dbeafe;
    --bot-bg:      #ffffff;
    --border:      #d1d9e6;
    --text:        #1e2a3a;
    --muted:       #6b7280;
    --chip-bg:     #e8f0fe;
    --chip-text:   #1a4f8a;
    --shadow:      0 2px 8px rgba(0,0,0,.10);
    --radius:      12px;
  }

  body {
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    background: var(--bg);
    color: var(--text);
    height: 100dvh;
    display: flex;
    flex-direction: column;
  }

  /* ── Header ──────────────────────────────────────────────── */
  header {
    background: var(--primary);
    color: #fff;
    padding: 14px 20px;
    display: flex;
    align-items: center;
    gap: 12px;
    box-shadow: 0 2px 6px rgba(0,0,0,.25);
    flex-shrink: 0;
  }
  header .logo {
    width: 38px; height: 38px;
    background: var(--accent);
    border-radius: 8px;
    display: flex; align-items: center; justify-content: center;
    font-weight: 800; font-size: 16px; color: #fff;
    letter-spacing: -1px;
  }
  header h1 { font-size: 1.15rem; font-weight: 700; }
  header p  { font-size: .78rem; opacity: .75; margin-top: 2px; }
  header .spacer { flex: 1; }
  #stats-badge {
    font-size: .72rem;
    background: rgba(255,255,255,.15);
    border: 1px solid rgba(255,255,255,.25);
    padding: 4px 10px;
    border-radius: 20px;
    cursor: default;
  }

  /* ── Chat container ───────────────────────────────────────── */
  #chat {
    flex: 1;
    overflow-y: auto;
    padding: 20px 16px;
    display: flex;
    flex-direction: column;
    gap: 16px;
    scroll-behavior: smooth;
  }

  /* ── Message bubbles ──────────────────────────────────────── */
  .msg {
    display: flex;
    flex-direction: column;
    max-width: min(760px, 92%);
    animation: fadeUp .2s ease;
  }
  .msg.user  { align-self: flex-end; align-items: flex-end; }
  .msg.bot   { align-self: flex-start; align-items: flex-start; }

  .bubble {
    padding: 12px 16px;
    border-radius: var(--radius);
    line-height: 1.6;
    font-size: .93rem;
    box-shadow: var(--shadow);
    white-space: pre-wrap;
    word-break: break-word;
  }
  .msg.user .bubble {
    background: var(--user-bg);
    border-bottom-right-radius: 3px;
    color: var(--primary-dk);
  }
  .msg.bot .bubble {
    background: var(--bot-bg);
    border: 1px solid var(--border);
    border-bottom-left-radius: 3px;
  }

  /* Markdown-like rendering inside bot bubble */
  .bubble strong { font-weight: 600; }
  .bubble code {
    font-family: "SFMono-Regular", Consolas, monospace;
    background: #f1f5f9;
    padding: 1px 5px;
    border-radius: 4px;
    font-size: .85em;
  }
  .bubble pre {
    background: #1e2a3a;
    color: #e2e8f0;
    padding: 10px 14px;
    border-radius: 8px;
    overflow-x: auto;
    font-size: .82em;
    margin: 8px 0;
  }
  .bubble pre code { background: none; padding: 0; }

  /* ── Journal bibliography ────────────────────────────────── */
  .references {
    margin-top: 10px;
    border-top: 1px solid var(--border);
    padding-top: 8px;
    max-width: 100%;
  }
  .ref-heading {
    color: var(--muted);
    font-size: .68rem;
    font-weight: 700;
    letter-spacing: .06em;
    text-transform: uppercase;
    margin-bottom: 5px;
  }
  .ref-entry {
    display: flex;
    align-items: baseline;
    gap: 6px;
    padding: 2px 0;
    text-decoration: none;
    color: var(--primary);
    font-size: .78rem;
    line-height: 1.45;
  }
  .ref-entry:hover .ref-label { text-decoration: underline; }
  .ref-num {
    color: var(--accent);
    font-weight: 700;
    font-size: .78rem;
    flex-shrink: 0;
    min-width: 22px;
  }
  .ref-label { flex: 1; }
  .ref-section {
    color: var(--muted);
    font-size: .74rem;
  }

  /* ── Inline citation superscripts ────────────────────────────── */
  .cite-link {
    color: var(--primary);
    text-decoration: none;
    font-size: .72em;
    font-weight: 600;
    vertical-align: super;
    line-height: 0;
    border: 1px solid var(--primary);
    border-radius: 3px;
    padding: 0 3px;
    margin: 0 1px;
    transition: background .12s, color .12s;
  }
  .cite-link:hover {
    background: var(--primary);
    color: #fff;
  }

  /* ── Typing indicator ─────────────────────────────────────── */
  #typing {
    display: none;
    align-self: flex-start;
    background: var(--bot-bg);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    border-bottom-left-radius: 3px;
    padding: 12px 16px;
    box-shadow: var(--shadow);
  }
  #typing span {
    display: inline-block;
    width: 8px; height: 8px;
    background: var(--muted);
    border-radius: 50%;
    animation: bounce .9s infinite;
  }
  #typing span:nth-child(2) { animation-delay: .15s; }
  #typing span:nth-child(3) { animation-delay: .30s; }

  /* ── Input bar ────────────────────────────────────────────── */
  #input-bar {
    background: var(--surface);
    border-top: 1px solid var(--border);
    padding: 12px 16px;
    display: flex;
    gap: 10px;
    align-items: flex-end;
    flex-shrink: 0;
  }
  #msg-input {
    flex: 1;
    resize: none;
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 10px 14px;
    font-size: .93rem;
    font-family: inherit;
    line-height: 1.5;
    max-height: 160px;
    outline: none;
    transition: border-color .15s;
    color: var(--text);
    background: var(--bg);
  }
  #msg-input:focus { border-color: var(--primary); }
  #msg-input::placeholder { color: var(--muted); }

  #send-btn {
    background: var(--primary);
    color: #fff;
    border: none;
    border-radius: 10px;
    padding: 10px 18px;
    font-size: .93rem;
    font-weight: 600;
    cursor: pointer;
    transition: background .15s, transform .1s;
    white-space: nowrap;
    flex-shrink: 0;
  }
  #send-btn:hover:not(:disabled)  { background: var(--primary-dk); }
  #send-btn:active:not(:disabled) { transform: scale(.97); }
  #send-btn:disabled { opacity: .5; cursor: not-allowed; }

  #hint { font-size: .72rem; color: var(--muted); text-align: center; padding: 4px 0 2px; }

  /* ── Intro card ───────────────────────────────────────────── */
  #intro {
    align-self: center;
    text-align: center;
    max-width: 520px;
    padding: 32px 24px;
  }
  #intro .icon { font-size: 2.5rem; margin-bottom: 12px; }
  #intro h2   { font-size: 1.15rem; font-weight: 700; margin-bottom: 8px; color: var(--primary); }
  #intro p    { font-size: .88rem; color: var(--muted); line-height: 1.6; }
  .suggestions { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; margin-top: 18px; }
  .suggestion {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 20px;
    padding: 7px 14px;
    font-size: .82rem;
    cursor: pointer;
    transition: border-color .15s, background .15s;
    color: var(--primary);
    font-weight: 500;
  }
  .suggestion:hover { border-color: var(--primary); background: var(--chip-bg); }

  /* ── Error banner ─────────────────────────────────────────── */
  .error-bubble {
    background: #fef2f2;
    border: 1px solid #fecaca;
    color: #991b1b;
    border-radius: var(--radius);
    padding: 10px 14px;
    font-size: .88rem;
    max-width: min(600px, 92%);
    align-self: flex-start;
  }

  /* ── Animations ───────────────────────────────────────────── */
  @keyframes bounce {
    0%, 80%, 100% { transform: translateY(0); }
    40% { transform: translateY(-6px); }
  }
  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(6px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  /* ── Scrollbar ────────────────────────────────────────────── */
  #chat::-webkit-scrollbar { width: 6px; }
  #chat::-webkit-scrollbar-track { background: transparent; }
  #chat::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }
</style>
</head>
<body>

<header>
  <div class="logo">GS</div>
  <div>
    <h1>GSAS-II Assistant</h1>
    <p>Powered by GSAS-II docs</p>
  </div>
  <div class="spacer"></div>
  <div id="stats-badge" title="Number of indexed documentation chunks">Loading…</div>
</header>

<div id="chat">
  <div id="intro">
    <div class="icon">🔬</div>
    <h2>Ask anything about GSAS-II</h2>
    <p>I have read the tutorials, help manual, and documentation.
       Ask about Rietveld refinement, sequential fits, structure solution,
       scripting, calibration, and more.</p>
    <div class="suggestions">
      <button class="suggestion" onclick="useSuggestion(this)">How do I do a Rietveld refinement?</button>
      <button class="suggestion" onclick="useSuggestion(this)">How do I set up a sequential refinement?</button>
      <button class="suggestion" onclick="useSuggestion(this)">What is Le Bail intensity extraction?</button>
      <button class="suggestion" onclick="useSuggestion(this)">How do I script a refinement in Python?</button>
      <button class="suggestion" onclick="useSuggestion(this)">How do I calibrate an area detector?</button>
      <button class="suggestion" onclick="useSuggestion(this)">How do I solve a structure with charge flipping?</button>
    </div>
  </div>
  <div id="typing"><span></span><span></span><span></span></div>
</div>

<div id="input-bar">
  <textarea id="msg-input" rows="1" placeholder="Ask about GSAS-II tutorials, parameters, procedures…" maxlength="2000"></textarea>
  <button id="send-btn" onclick="sendMessage()">Send</button>
</div>
<div id="hint">Enter to send &nbsp;·&nbsp; Shift+Enter for new line</div>

<script>
const chatEl   = document.getElementById('chat');
const inputEl  = document.getElementById('msg-input');
const sendBtn  = document.getElementById('send-btn');
const typingEl = document.getElementById('typing');
const introEl  = document.getElementById('intro');
const statsEl  = document.getElementById('stats-badge');

let history = [];
let sending = false;

// ── Stats ─────────────────────────────────────────────────────────────────
fetch('/stats').then(r => r.json()).then(d => {
  statsEl.textContent = d.chunks_indexed > 0
    ? `${d.chunks_indexed.toLocaleString()} chunks indexed · ${d.llm_backend}`
    : 'Not yet indexed — run ingest.py';
}).catch(() => { statsEl.textContent = 'Server offline'; });

// ── Auto-resize textarea ───────────────────────────────────────────────────
inputEl.addEventListener('input', () => {
  inputEl.style.height = 'auto';
  inputEl.style.height = Math.min(inputEl.scrollHeight, 160) + 'px';
});

inputEl.addEventListener('keydown', e => {
  if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendMessage(); }
});

// ── Suggestion chips ───────────────────────────────────────────────────────
function useSuggestion(btn) {
  inputEl.value = btn.textContent.trim();
  inputEl.dispatchEvent(new Event('input'));
  sendMessage();
}

// ── Send ───────────────────────────────────────────────────────────────────
async function sendMessage() {
  const text = inputEl.value.trim();
  if (!text || sending) return;

  hideIntro();
  appendMessage('user', text, []);
  history.push({ role: 'user', content: text });

  inputEl.value = '';
  inputEl.style.height = 'auto';
  setSending(true);
  showTyping();

  try {
    const res = await fetch('/chat', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ message: text, history: history.slice(-12) }),
    });

    if (!res.ok) {
      const err = await res.json().catch(() => ({ detail: res.statusText }));
      throw new Error(err.detail || `HTTP ${res.status}`);
    }

    const data = await res.json();
    hideTyping();
    appendMessage('bot', data.answer, data.sources || [], data.citations || {});
    history.push({ role: 'assistant', content: data.answer });
  } catch (err) {
    hideTyping();
    appendError(`Error: ${err.message}`);
  } finally {
    setSending(false);
    inputEl.focus();
  }
}

// ── DOM helpers ────────────────────────────────────────────────────────────
function hideIntro() {
  if (introEl) introEl.style.display = 'none';
}

function setSending(state) {
  sending = state;
  sendBtn.disabled = state;
  sendBtn.textContent = state ? '…' : 'Send';
}

function showTyping() {
  typingEl.style.display = 'block';
  chatEl.insertBefore(typingEl, null);
  chatEl.scrollTop = chatEl.scrollHeight;
}

function hideTyping() {
  typingEl.style.display = 'none';
}

function appendMessage(role, text, sources, citations = {}) {
  const msgEl = document.createElement('div');
  msgEl.className = `msg ${role}`;

  const bubbleEl = document.createElement('div');
  bubbleEl.className = 'bubble';
  bubbleEl.innerHTML = renderMarkdown(text, citations);
  msgEl.appendChild(bubbleEl);

  // Journal-style bibliography: only list numbers that appear inline in the text
  if (role === 'bot' && Object.keys(citations).length > 0) {
    const usedNums = new Set();
    for (const m of text.matchAll(/\[(\d+)\]/g)) usedNums.add(m[1]);

    const entries = Object.keys(citations)
      .sort((a, b) => Number(a) - Number(b));

    if (entries.length > 0) {
      const refEl = document.createElement('div');
      refEl.className = 'references';

      const heading = document.createElement('div');
      heading.className = 'ref-heading';
      heading.textContent = 'References';
      refEl.appendChild(heading);

      entries.forEach(k => {
        const s = citations[k];
        const section = s.section && s.section !== s.title ? s.section : '';
        const a = document.createElement('a');
        a.className = 'ref-entry';
        a.href = s.url;
        a.target = '_blank';
        a.rel = 'noopener noreferrer';
        a.innerHTML =
          `<span class="ref-num">[${k}]</span>` +
          `<span class="ref-label">${escHtml(s.title)}` +
          (section ? `<span class="ref-section"> — ${escHtml(section)}</span>` : '') +
          `</span>`;
        refEl.appendChild(a);
      });

      msgEl.appendChild(refEl);
    }
  }

  // Insert before typing indicator
  chatEl.insertBefore(msgEl, typingEl);
  chatEl.scrollTop = chatEl.scrollHeight;
}

function appendError(msg) {
  const el = document.createElement('div');
  el.className = 'error-bubble';
  el.textContent = msg;
  chatEl.insertBefore(el, typingEl);
  chatEl.scrollTop = chatEl.scrollHeight;
}

// ── Minimal markdown renderer ──────────────────────────────────────────────
function renderMarkdown(text, citations = {}) {
  return text
    .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
    // Code blocks (must run before inline code)
    .replace(/```[\w]*\n?([\s\S]*?)```/g, '<pre><code>$1</code></pre>')
    // Inline code
    .replace(/`([^`]+)`/g, '<code>$1</code>')
    // Bold
    .replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>')
    // Italic
    .replace(/\*(.+?)\*/g, '<em>$1</em>')
    // Headers
    .replace(/^### (.+)$/gm, '<strong>$1</strong>')
    .replace(/^## (.+)$/gm,  '<strong>$1</strong>')
    .replace(/^# (.+)$/gm,   '<strong>$1</strong>')
    // Numbered lists
    .replace(/^\d+\.\s+(.+)$/gm, '• $1')
    // Bullets
    .replace(/^[-*]\s+(.+)$/gm, '• $1')
    // Inline citations [N] → clickable superscript using citations map keyed by string
    .replace(/\[(\d+)\]/g, (_, n) => {
      const s = citations[n];
      if (!s) return `[${n}]`;
      const tip = escHtml(`${s.title} › ${s.section}`);
      return `<a href="${escHtml(s.url)}" target="_blank" rel="noopener noreferrer" class="cite-link" title="${tip}">[${n}]</a>`;
    })
    // Line breaks
    .replace(/\n/g, '<br>');
}

function escHtml(str) {
  return str.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}
</script>
</body>
</html>
